/* Fonts are injected by build.py as @font-face rules above this line. */
:root{
  --font-display:"Bitter", Georgia, "Times New Roman", serif;
  --font-body:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --scale:1;
  --radius-s:10px; --radius-m:16px; --radius-l:28px;
  --ink-on-accent:#15162B;
  --c-mornings:#F6C343; --c-start:#FF6B6B; --c-sides:#2EC4B6; --c-switch:#B79CFF; --c-toomuch:#6CC4FF;
  --c-empty:#FF9F45; --c-mains:#6ED18F; --c-treats:#FF8CC6; --c-wait:#D9B77E; --c-wind:#8D8FFF;
}
[data-theme="dusk"]{ --bg:#1B1D3D; --surface:#25284F; --raised:#30346A; --text:#F3F1FB; --muted:#B9B6DA; --line:#40447A; --focus:#FFE38A; --glow:rgba(183,156,255,.18); }
[data-theme="day"]{ --bg:#EDEFF5; --surface:#FFFFFF; --raised:#F5F6FA; --text:#1B1D33; --muted:#565A78; --line:#D3D6E4; --focus:#3A3FD0; --glow:rgba(255,107,107,.12); }
[data-theme="forest"]{ --bg:#12302B; --surface:#1A3D37; --raised:#234C45; --text:#EEF6F2; --muted:#A9C8BE; --line:#33605A; --focus:#FFE38A; --glow:rgba(110,209,143,.16); }
[data-theme="berry"]{ --bg:#2B1630; --surface:#3A1F41; --raised:#4A2A52; --text:#FBEFF8; --muted:#D7B8D0; --line:#603868; --focus:#FFE38A; --glow:rgba(255,140,198,.16); }

*{ box-sizing:border-box; }
html{ font-size:calc(17px * var(--scale)); -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.5; min-height:100vh;
  background-image:radial-gradient(1200px 600px at 85% -10%, var(--glow), transparent 60%); background-attachment:fixed; }
body.easy{ --font-body:Verdana, Tahoma, "DejaVu Sans", sans-serif; letter-spacing:.02em; word-spacing:.06em; line-height:1.65; }
button, input, textarea, select{ font:inherit; color:inherit; }
a{ color:inherit; }
:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; border-radius:6px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------- top bar ---------- */
.top, .bnav{ font-size:16px; letter-spacing:0; word-spacing:0; font-family:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.top{ padding-top:env(safe-area-inset-top); position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.top-in{ max-width:760px; margin:0 auto; padding:.55em 1em; display:flex; align-items:center; gap:.6em; }
.brand{ font-family:var(--font-display); font-weight:800; font-size:1.15em; letter-spacing:-.01em; background:none; border:0; padding:.2em 0; cursor:pointer; margin-right:auto; white-space:nowrap; }
.langs{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
.langs button{ background:none; border:0; padding:.25em .55em; font-size:.78em; font-weight:600; cursor:pointer; color:var(--muted); }
.langs button[aria-pressed="true"]{ background:var(--text); color:var(--bg); }
.helppill{ background:none; border:1px solid var(--line); color:var(--text); border-radius:999px; padding:.3em .7em; font-size:.78em; cursor:pointer; white-space:nowrap; }
.helppill:hover{ border-color:var(--muted); }
.hl-short{ display:none; }
@media (max-width:600px){
  .hl-long{ display:none; } .hl-short{ display:inline; }
  .top-in{ gap:.45em; padding:.5em .8em; }
  .brand{ font-size:1.02em; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .langs button{ padding:.25em .45em; }
}
.timerchip{ background:var(--c-start); color:var(--ink-on-accent); border:0; border-radius:999px; padding:.25em .6em; font-weight:700; font-size:.78em; cursor:pointer; font-variant-numeric:tabular-nums; }
.deskNav{ display:none; }

/* ---------- layout ---------- */
main{ max-width:760px; margin:0 auto; padding:1.2rem 1rem 7rem; }
h1,h2,h3{ font-family:var(--font-display); line-height:1.15; margin:0; letter-spacing:-.01em; }
h1{ font-size:2.1rem; font-weight:800; }
h2{ font-size:1.5rem; font-weight:700; }
h3{ font-size:1.15rem; font-weight:700; }
p{ margin:.5rem 0; max-width:62ch; }
.muted{ color:var(--muted); }
.small{ font-size:.86rem; }
.stack > * + *{ margin-top:1rem; }
.row{ display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:.4rem; min-height:44px; padding:.55rem 1.05rem; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; font-weight:600; text-decoration:none; }
.btn:hover{ border-color:var(--muted); }
.btn.primary{ background:var(--text); color:var(--bg); border-color:var(--text); }
.btn.quiet{ background:none; }
.btn.small{ min-height:36px; padding:.35rem .8rem; font-size:.86rem; }
.chipset{ display:flex; flex-wrap:wrap; gap:.45rem; }
.chip{ min-height:40px; padding:.45rem .9rem; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; text-align:left; }
.chip[aria-pressed="true"]{ background:var(--text); color:var(--bg); border-color:var(--text); }

/* ---------- welcome ---------- */
.welcome{ padding-top:1.5rem; }
.welcome h1{ font-size:clamp(2.6rem, 11vw, 4.4rem); font-weight:800; line-height:.95; letter-spacing:-.02em; }
.welcome .tag{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:1.25rem; color:var(--muted); margin-top:.6rem; }
.plates{ display:flex; gap:6px; margin:1.4rem 0 1.2rem; }
.plates span{ flex:1; height:10px; border-radius:999px; }

/* ---------- check-in window (the signature element) ---------- */
.window{ display:grid; grid-template-rows:1fr 1.35fr 1fr; gap:6px; margin-top:1rem; padding:6px; border-radius:var(--radius-l); border:1.5px solid var(--line); background:var(--surface); }
.zone{ position:relative; display:flex; flex-direction:column; justify-content:center; gap:.15rem; text-align:left; min-height:118px; padding:1rem 1.2rem; border:0; border-radius:calc(var(--radius-l) - 6px); cursor:pointer; color:var(--ink-on-accent); overflow:hidden; transition:transform .25s ease, filter .25s ease; }
.zone:hover{ filter:brightness(1.05); }
.zone:active{ transform:scale(.985); }
.zone .zl{ font-family:var(--font-display); font-weight:800; font-size:1.9rem; line-height:1; }
.zone .zs{ font-size:.92rem; font-weight:500; opacity:.9; }
.zone.wired{ background:linear-gradient(135deg, #FF6B6B, #FF9F45); }
.zone.okay{ background:linear-gradient(135deg, #7FDC9C, #2EC4B6); min-height:150px; }
.zone.flat{ background:linear-gradient(135deg, #8EA0C9, #8D8FFF); }
.zone.wired::after{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(115deg, rgba(255,255,255,.12) 0 2px, transparent 2px 14px); pointer-events:none; }
.zone.flat::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent, rgba(20,20,40,.18)); pointer-events:none; }
.feel{ margin-top:.6rem; }
.feel summary{ cursor:pointer; color:var(--muted); font-size:.9rem; }
.feel dl{ margin:.6rem 0 0; display:grid; gap:.7rem; }
.feel dt{ font-weight:700; }
.feel dd{ margin:0; color:var(--muted); font-size:.92rem; }
.notsure{ margin-top:.9rem; display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }

/* ---------- situations ---------- */
.sits{ display:grid; gap:.5rem; margin-top:1rem; }
.sit{ display:flex; align-items:center; gap:.8rem; min-height:56px; padding:.7rem 1rem; border-radius:var(--radius-m); border:1.5px solid var(--line); background:var(--surface); cursor:pointer; text-align:left; font-weight:500; }
.sit:hover{ border-color:var(--muted); }
.sit .dot{ width:14px; height:14px; border-radius:50%; flex:none; }

/* ---------- results ---------- */
.course{ border-left:6px solid var(--sec); padding-left:1rem; }
.rest{ font-family:var(--font-display); font-style:italic; font-weight:500; color:var(--muted); font-size:1rem; }
.options{ list-style:none; margin:1rem 0 0; padding:0; display:grid; gap:.6rem; }
.opt{ display:flex; flex-wrap:wrap; gap:.6rem .9rem; align-items:flex-start; justify-content:space-between; padding:1rem 1.1rem; border-radius:var(--radius-m); background:var(--surface); border:1.5px solid var(--line); }
.opt .t{ font-size:1.08rem; font-weight:500; flex:1 1 14ch; }
.opt .helpedbtn{ flex:none; background:none; border:1.5px solid var(--line); border-radius:999px; padding:.3rem .7rem; font-size:.8rem; cursor:pointer; color:var(--muted); min-height:36px; }
.opt .helpedbtn[aria-pressed="true"]{ background:var(--sec); color:var(--ink-on-accent); border-color:var(--sec); }
.note{ padding:.8rem 1rem; border-radius:var(--radius-s); background:var(--raised); font-size:.92rem; }
.note.warn{ border-left:4px solid var(--c-empty); }
.bodycheck ol{ padding-left:1.3rem; }
.bodycheck li{ margin:.35rem 0; }

/* ---------- build ---------- */
.sec{ border:1.5px solid var(--line); border-radius:var(--radius-m); background:var(--surface); overflow:hidden; }
.sec + .sec{ margin-top:.6rem; }
.sec > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:.8rem; padding:.9rem 1rem; }
.sec > summary::-webkit-details-marker{ display:none; }
.sec .swatch{ width:12px; align-self:stretch; border-radius:999px; background:var(--sec); flex:none; }
.sec .names{ flex:1; }
.sec .names .rest{ display:block; font-size:.9rem; }
.sec .names h3{ font-size:1.2rem; }
.sec .count{ font-size:.8rem; color:var(--muted); white-space:nowrap; }
.sec .chev{ transition:transform .2s; }
.sec[open] .chev{ transform:rotate(180deg); }
.sec-body{ padding:0 1rem 1rem; }
.sec.is-hidden .names{ opacity:.55; }
.pick{ display:flex; flex-wrap:wrap; gap:.45rem; margin:.6rem 0; }
.pick .chip[aria-pressed="true"]{ background:var(--sec); color:var(--ink-on-accent); border-color:var(--sec); }
.own{ display:flex; flex-wrap:wrap; gap:.45rem; margin:.4rem 0 .6rem; }
.ownitem{ display:inline-flex; align-items:center; gap:.3rem; padding:.35rem .4rem .35rem .85rem; border-radius:999px; background:var(--sec); color:var(--ink-on-accent); font-weight:500; }
.ownitem button{ border:0; background:rgba(0,0,0,.12); color:inherit; border-radius:50%; width:28px; height:28px; cursor:pointer; font-size:1rem; line-height:1; }
.addrow{ display:flex; gap:.5rem; margin-top:.4rem; }
.addrow input{ flex:1; min-width:0; min-height:44px; padding:.5rem .9rem; border-radius:999px; border:1.5px solid var(--line); background:var(--raised); }
.label{ font-size:.82rem; font-weight:700; color:var(--muted); margin-top:.8rem; }
.themes{ display:flex; gap:.6rem; flex-wrap:wrap; }
.themebtn{ display:flex; align-items:center; gap:.5rem; padding:.35rem .8rem .35rem .4rem; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; min-height:44px; }
.themebtn[aria-pressed="true"]{ border-color:var(--text); box-shadow:0 0 0 1px var(--text) inset; }
.themebtn i{ width:28px; height:28px; border-radius:50%; display:block; }
.example{ border-top:1px solid var(--line); padding:1rem 0; }
.example h3 .age{ font-family:var(--font-body); font-weight:500; color:var(--muted); font-size:.95rem; }
.exrow{ margin:.6rem 0; }
.exrow .sn{ font-weight:700; font-size:.9rem; display:flex; align-items:center; gap:.4rem; }
.exrow .sn i{ width:10px; height:10px; border-radius:50%; display:inline-block; }
.exitems{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.35rem; }
.exitem{ display:inline-flex; align-items:center; gap:.4rem; padding:.3rem .35rem .3rem .75rem; border-radius:999px; border:1.5px solid var(--line); background:var(--raised); font-size:.9rem; }
.exitem button{ border:0; border-radius:999px; background:var(--surface); padding:.2rem .55rem; cursor:pointer; font-size:.78rem; font-weight:600; min-height:30px; }
.exitem button[disabled]{ opacity:.6; cursor:default; }

/* ---------- my menu (poster) ---------- */
.poster{ margin-top:1rem; border-radius:var(--radius-l); background:var(--surface); border:1.5px solid var(--line); padding:1.6rem 1.3rem; }
.poster-head{ text-align:center; padding-bottom:1rem; border-bottom:1.5px solid var(--line); margin-bottom:1rem; }
.poster-head h2{ font-size:2rem; font-weight:800; }
.poster-head p{ margin:.2rem auto 0; font-family:var(--font-display); font-style:italic; color:var(--muted); }
.pgrid{ columns:2 280px; column-gap:2rem; }
.pcourse{ break-inside:avoid; margin-bottom:1.3rem; }
.pcourse .ph{ display:flex; align-items:baseline; gap:.5rem; border-bottom:3px solid var(--sec); padding-bottom:.25rem; }
.pcourse .ph h3{ font-size:1.15rem; }
.pcourse .rest{ font-size:.88rem; }
.pcourse ul{ list-style:none; margin:.5rem 0 0; padding:0; }
.pcourse li{ padding:.25rem 0 .25rem 1.1rem; position:relative; }
.pcourse li::before{ content:""; position:absolute; left:0; top:.78em; width:7px; height:7px; border-radius:50%; background:var(--sec); }
.pcourse .pf{ font-size:.82rem; color:var(--muted); font-style:italic; margin-top:.3rem; }
.poster-foot{ border-top:1.5px solid var(--line); padding-top:.9rem; text-align:center; font-family:var(--font-display); font-style:italic; color:var(--muted); }
.lockpanel{ margin-top:1rem; padding:1rem; border-radius:var(--radius-m); background:var(--raised); }
.lockpanel img{ display:block; max-width:min(260px, 70vw); border-radius:18px; margin:.8rem 0; border:1px solid var(--line); }

/* ---------- timer ---------- */
.dial{ position:relative; width:min(300px, 78vw); aspect-ratio:1; margin:1.2rem auto; }
.dial svg{ width:100%; height:100%; transform:rotate(-90deg); }
.dial .readout{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:800; font-size:3.2rem; font-variant-numeric:tabular-nums; }
.dial .readout small{ font-family:var(--font-body); font-weight:500; font-size:.9rem; color:var(--muted); }

/* ---------- help + text pages ---------- */
.helpcard{ border-radius:var(--radius-l); background:var(--surface); border:1.5px solid var(--line); padding:1.4rem 1.3rem; }
.helpcard .hb{ padding:.8rem 0; border-top:1px solid var(--line); }
.helpcard .hb:first-of-type{ border-top:0; }
.field{ display:grid; gap:.3rem; margin:.6rem 0; }
.field input, .field textarea{ min-height:44px; padding:.6rem .9rem; border-radius:var(--radius-s); border:1.5px solid var(--line); background:var(--raised); width:100%; }
.field textarea{ min-height:96px; resize:vertical; }
.field label{ font-weight:600; font-size:.92rem; }
.prose .pb{ margin:1rem 0; }
.prose .pb strong{ display:block; font-family:var(--font-display); font-size:1.08rem; margin-bottom:.2rem; }
.setting{ padding:1rem 0; border-top:1px solid var(--line); }
.setting:first-of-type{ border-top:0; }
.morelist{ display:grid; gap:.5rem; margin-top:1rem; }
.morelist .sit{ justify-content:space-between; }

/* ---------- bottom nav (phones) ---------- */
.bnav{ position:fixed; bottom:0; left:0; right:0; z-index:20; display:grid; grid-template-columns:repeat(5,1fr); background:color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
.bnav button{ background:none; border:0; padding:.55em .2em .6em; display:flex; flex-direction:column; align-items:center; gap:.15em; font-size:.72em; font-weight:600; color:var(--muted); cursor:pointer; min-height:56px; }
.bnav button svg{ width:22px; height:22px; }
.bnav button[aria-current="page"]{ color:var(--text); }
.bnav button[aria-current="page"] svg{ stroke:var(--text); }

/* ---------- dialog + toast ---------- */
.scrim{ position:fixed; inset:0; background:rgba(10,10,25,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:1rem; }
.dialog{ background:var(--surface); border-radius:var(--radius-m); padding:1.3rem; max-width:420px; width:100%; border:1.5px solid var(--line); }
.toast{ position:fixed; left:50%; bottom:5.2rem; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:.6rem 1rem; border-radius:999px; font-weight:600; font-size:.9rem; z-index:60; max-width:90vw; text-align:center; }
.toast:empty{ display:none; }

/* entrance: one orchestrated moment on the check-in window only */
@keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
.window .zone{ animation:rise .5s ease both; }
.window .zone:nth-child(2){ animation-delay:.07s; } .window .zone:nth-child(3){ animation-delay:.14s; }
body.still *, body.still *::before, body.still *::after{ animation:none !important; transition:none !important; }
@media (prefers-reduced-motion: reduce){ *, *::before, *::after{ animation:none !important; transition:none !important; } }

@media (min-width:1100px){
  .bnav{ display:none; }
  .deskNav{ display:flex; gap:.2rem; }
  .deskNav button{ white-space:nowrap; background:none; border:0; padding:.35em .6em; border-radius:999px; cursor:pointer; color:var(--muted); font-weight:600; font-size:.88em; }
  .deskNav button[aria-current="page"]{ color:var(--text); background:var(--raised); }
  .top-in{ max-width:1200px; }
  .brand{ margin-right:1rem; }
  .langs{ margin-left:auto; }
  main{ padding-bottom:3rem; }
  .toast{ bottom:2rem; }
}

/* ---------- print: A4 landscape menu, always light ---------- */
#printarea{ display:none; }
@media print{
  @page{ size:A4 landscape; margin:11mm; }
  body{ background:#fff !important; color:#1B1D33 !important; }
  .top, .bnav, main, .toast, .scrim{ display:none !important; }
  #printarea{ display:block; color:#1B1D33; font-size:11.5pt; }
  #printarea p{ max-width:none; }
  #printarea h1{ font-family:var(--font-display); font-weight:800; font-size:30pt; text-align:center; margin:0; }
  #printarea .ptag{ text-align:center; font-family:var(--font-display); font-style:italic; color:#565A78; margin:2pt 0 10pt; }
  #printarea .pgrid{ columns:4; column-gap:9mm; }
  #printarea .pcourse{ margin-bottom:9pt; }
  #printarea .pcourse .ph{ border-bottom-width:2.5pt; }
  #printarea .pcourse h3{ font-size:14pt; }
  #printarea .rest{ color:#565A78; }
  #printarea .pcourse li{ padding:1.5pt 0 1.5pt 9pt; }
  #printarea .pcourse li::before{ width:5pt; height:5pt; top:.6em; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #printarea .pcourse .ph{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  #printarea .pcourse .pf{ color:#565A78; }
  #printarea .pfoot{ border-top:1pt solid #D3D6E4; margin-top:6pt; padding-top:5pt; text-align:center; font-family:var(--font-display); font-style:italic; color:#565A78; }
}

en:{ title:"Need more than a menu?",
 intro:"A menu is for everyday ups and downs. Some things are too big for it. That isn't a failure. It just means it's time to talk to someone.",
 blocks:[
  ["Talk to someone you trust.","A parent, a teacher or your trainer at work, a school counsellor, a coach, your therapist. You can show them this screen if saying it out loud is hard."],
  ["Talk to a helpline.","There are free helplines for young people in most countries, and many are open day and night. Lots of them let you text or chat if talking out loud feels too hard, and many don't ask for your name. Find one for your country at {link} (needs internet)."],
  ["If you're hurting yourself, thinking about it, or thinking about ending your life or not wanting to be here,","you deserve help today. Tell someone now, or contact a helpline. It's okay to say it straight out."],
  ["If you've felt flat most days for a couple of weeks, or things feel hopeless,","that's worth telling someone about too, even if nothing feels urgent."],
  ["If you or someone else is in danger right now,","call your local emergency number. In Europe, 112 works almost everywhere, including Switzerland and the UK, and it's free."]],

  ["Melde dich bei einem Sorgentelefon.","In den meisten Ländern gibt es kostenlose Sorgentelefone für junge Menschen, oft rund um die Uhr. Viele kannst du auch per Chat oder Nachricht erreichen, wenn Reden zu schwer ist, und oft musst du deinen Namen nicht sagen. Eine für dein Land findest du auf {link} (braucht Internet)."],
  ["Wenn du dich selbst verletzt oder daran denkst, oder wenn du daran denkst, dir das Leben zu nehmen, oder nicht mehr da sein willst,","hast du Hilfe verdient, und zwar heute. Sag es jetzt jemandem oder melde dich bei einem Sorgentelefon. Es ist okay, es direkt auszusprechen."],
  ["Wenn du dich seit etwa zwei Wochen an den meisten Tagen platt fühlst oder alles hoffnungslos wirkt,","lohnt es sich auch, das jemandem zu erzählen, selbst wenn es nicht dringend wirkt."],

/* Page for adults */
var ADULTS = {
en:{ title:"For parents, teachers and therapists", blocks:[
 ["What this is.","A menu of small things a young person can choose from when they need to get started, stay focused, switch between things, calm down when it's too much, or warm up when they've gone flat. They build it themselves, from suggestions plus their own ideas."],
 ["What it isn't.","It isn't treatment, a diagnosis tool, a safety plan or a behaviour chart. There's no tracking, no score and nothing to complete. It builds on the dopamine menu idea made popular by Eric Tivers and Jessica McCabe, and on the window of tolerance (Dan Siegel): wired, okay, flat. “Dopamine” is a nickname here, not a claim about brain chemistry."],
 ["How to introduce it.","Offer it once, lightly. Let them build it alone if they want to. Ask what they picked, not whether they used it."],
 ["Not as a consequence, not mid-meltdown.","Don't send someone to the menu as a punishment or in the middle of a meltdown. When someone is very wired or very flat, a calm adult nearby helps more than a list."],
 ["If it feels like pressure, put it away.","For some people a menu like this is a relief. For others, especially when everything already feels like too much, it can feel like one more thing they're failing at. Both reactions are normal. It may be useful later, or never, and that's fine."],
 ["The “flat” side matters.","Getting wired is easy to spot. Shutting down is much harder to notice from the inside. If you notice someone has gone quiet, telling them gently can help them recognise it. Withdrawal that lasts, or a big change in sleep, eating or mood, is worth a proper conversation and, if needed, professional support."],
 ["Privacy.","Nothing is sent anywhere. But anyone using the same device and browser can open it, including their notes and the number they saved, so on a shared device “Clear everything” in settings wipes it."],
 ["This is not a crisis tool.","The help card points to trusted adults, helplines and emergency numbers, but it doesn't replace professional care."]]},
de:{ title:"Für Eltern, Lehrpersonen und Fachleute", blocks:[
 ["Was das ist.","Ein Menü mit kleinen Dingen, aus denen ein junger Mensch wählen kann, wenn er loslegen, dranbleiben, zwischen Dingen wechseln, bei zu viel runterkommen oder wieder in Gang kommen muss, wenn er platt ist. Die jungen Menschen bauen es selbst, aus Vorschlägen und eigenen Ideen."],
 ["Was es nicht ist.","Es ist keine Behandlung, kein Diagnoseinstrument, kein Sicherheitsplan und keine Verhaltenstabelle. Es gibt kein Tracking, keine Punkte und nichts zu erledigen. Es baut auf der Idee des Dopamin-Menüs auf, bekannt gemacht von Eric Tivers und Jessica McCabe, und auf dem Toleranzfenster (Dan Siegel): aufgedreht, okay, platt. «Dopamin» ist hier ein Spitzname, keine Aussage über Hirnchemie."],
 ["Wie man es einführt.","Einmal anbieten, ganz locker. Wer will, baut es allein. Fragen Sie, was ausgewählt wurde, nicht, ob es benutzt wurde."],
 ["Nicht als Strafe, nicht mitten im Meltdown.","Schicken Sie niemanden zur Strafe oder mitten in einem Meltdown zum Menü. Wenn jemand sehr aufgedreht oder sehr platt ist, hilft eine ruhige erwachsene Person in der Nähe mehr als eine Liste."],
 ["Wenn es sich nach Druck anfühlt, legen Sie es weg.","Für manche ist so ein Menü eine Erleichterung. Für andere, besonders wenn ohnehin schon alles zu viel ist, kann es sich wie eine weitere Sache anfühlen, an der sie scheitern. Beide Reaktionen sind normal. Vielleicht hilft es später, vielleicht nie, und das ist in Ordnung."],
 ["Die «platte» Seite ist wichtig.","Aufgedreht sein fällt leicht auf. Abschalten ist von innen viel schwerer zu bemerken. Wenn Sie merken, dass jemand still geworden ist, kann ein sanfter Hinweis helfen, es zu erkennen. Rückzug, der anhält, oder eine grosse Veränderung bei Schlaf, Essen oder Stimmung verdient ein richtiges Gespräch und, falls nötig, professionelle Unterstützung."],
 ["Datenschutz.","Nichts wird irgendwohin geschickt. Aber alle, die dasselbe Gerät und denselben Browser nutzen, können es öffnen, auch die Notizen und die gespeicherte Nummer. Auf einem geteilten Gerät löscht «Alles löschen» in den Einstellungen alles."],
 ["Kein Krisen-Tool.","Die Hilfe-Seite verweist auf Vertrauenspersonen, Beratungsstellen und Notrufnummern, ersetzt aber keine professionelle Betreuung."]]},
fr:{ title:"Pour les parents, les enseignants et les thérapeutes", blocks:[
 ["Ce que c'est.","Un menu de petites choses parmi lesquelles un jeune peut choisir quand il a besoin de se lancer, de rester concentré, de passer d'une chose à une autre, de se calmer quand c'est trop, ou de se réchauffer quand il est à plat. Il le construit lui-même, à partir de suggestions et de ses propres idées."],
 ["Ce que ce n'est pas.","Ce n'est ni un traitement, ni un outil de diagnostic, ni un plan de sécurité, ni un tableau de comportement. Pas de suivi, pas de score, rien à terminer. L'outil s'appuie sur l'idée du « menu dopamine », popularisée par Eric Tivers et Jessica McCabe, et sur la fenêtre de tolérance (Dan Siegel) : sous tension, ça va, à plat. « Dopamine » est ici un surnom, pas une affirmation sur la chimie du cerveau."],
 ["Comment le présenter.","Proposez-le une fois, sans insister. Laissez le jeune le construire seul s'il le souhaite. Demandez ce qu'il a choisi, pas s'il l'a utilisé."],
 ["Pas comme une sanction, pas en pleine crise.","N'envoyez personne vers le menu comme punition ou au milieu d'une crise. Quand quelqu'un est très sous tension ou très à plat, un adulte calme à côté aide plus qu'une liste."],
 ["Si ça ressemble à une pression, rangez-le.","Pour certains, un menu comme celui-ci est un soulagement. Pour d'autres, surtout quand tout est déjà trop, ça peut devenir une chose de plus à rater. Les deux réactions sont normales. Il sera peut-être utile plus tard, ou jamais, et c'est très bien ainsi."],
 ["Le côté « à plat » compte.","Être sous tension se remarque facilement. Se refermer est beaucoup plus difficile à percevoir de l'intérieur. Si vous remarquez qu'un jeune ne parle plus beaucoup, le lui dire doucement peut l'aider à s'en rendre compte. Un repli qui dure, ou un grand changement dans le sommeil, l'alimentation ou l'humeur, mérite une vraie conversation et, si besoin, un soutien professionnel."],
 ["Confidentialité.","Rien n'est envoyé nulle part. Mais toute personne utilisant le même appareil et le même navigateur peut l'ouvrir, y compris les notes et le numéro enregistré. Sur un appareil partagé, « Tout effacer » dans les réglages efface tout."],
 ["Ce n'est pas un outil de crise.","La page d'aide renvoie vers des adultes de confiance, des lignes d'écoute et les numéros d'urgence, mais elle ne remplace pas une prise en charge professionnelle."]]}
};

var S = load();

/* ---------- helpers ---------- */

function findItem(s, id){ for(var i=0;i<s.items.length;i++){ if(s.items[i][0] === id) return s.items[i]; } return null; }

function $(sel, root){ return (root||document).querySelector(sel); }

/* ---------- app shell ---------- */

/* ---------- views ---------- */
function iosHint(){

    '<div class="row" style="margin-top:1.6rem"><button type="button" class="btn primary" data-act="start-now">'+esc(U("tryNow"))+'</button><button type="button" class="btn" data-act="start-build">'+esc(U("buildOwn"))+'</button></div>'+iosHint()+'</section>';

function pool(s){
  var mine = userItems(s);
  var fromLib = mine.length === 0;
  var list = fromLib ? starters(s).map(function(it){ return {key:it[0], text:itemText(it)}; }) : mine;
  return {list:list, fromLib:fromLib};
}
function buildOrder(s){
  var p = pool(s);
  var helped = p.list.filter(function(x){ return S.helped[x.key]; }).sort(function(a,b){ return S.helped[b.key]-S.helped[a.key]; });
  var rest = shuffle(p.list.filter(function(x){ return !S.helped[x.key]; }));
  now.order = helped.concat(rest).map(function(x){ return x.key; });
  now.fromLib = p.fromLib; now.offset = 0; now.marked = {};
}
function keyText(s, key){
  if(key.indexOf("o:") === 0){ var id = key.slice(2); var o = (S.own[s.id]||[]).filter(function(x){ return x.id === id; })[0]; return o ? o.text : ""; }
  var it = findItem(s, key); return it ? itemText(it) : "";

function vResults(){
  var s = sec(now.sec), t = st(s);

    (now.fromLib ? '<p class="small muted">'+esc(U("fromLibrary"))+'</p>' : '')+

function vBuild(){

function vExamples(){

  var creator = order.filter(function(e){ return e.creator; }); order = order.filter(function(e){ return !e.creator; }).concat(creator);
  var li = {en:1, de:2, fr:3}[S.lang];
  var html = order.map(function(e){
    var head = e.creator ? esc(e.title[S.lang]) : esc(e.name)+' <span class="age">'+e.age+'</span>';
    var rows = e.rows.map(function(r){ var s = sec(r[0]);

function vTimer(){

    else{

/* ---------- lock screen image ---------- */
function wrap(ctx, text, maxW){
  var words = String(text).split(/\s+/), lines = [], line = "";
  words.forEach(function(w){ var t = line ? line + " " + w : w; if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else { line = t; } });
  if(line) lines.push(line); return lines;
}
function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function makeLock(){
  var W = 1170, H = 2532, c = document.createElement("canvas"); c.width = W; c.height = H;
  var ctx = c.getContext("2d");
  var bg = cssVar("--bg") || "#1B1D3D", text = cssVar("--text") || "#F3F1FB", muted = cssVar("--muted") || "#B9B6DA";
  var x = 100, maxW = W - 2*x, top = Math.round(H*0.38), bottom = H - 230;
  var secs = SECTIONS.filter(function(s){ return lockSel.indexOf(s.id) >= 0 && userItems(s).length; }).slice(0,4);
  // layout pass: measure at scale k, draw when draw=true. Every item is kept; the type shrinks to fit.
  function lay(k, draw){
    var y = top;
    if(draw){ ctx.fillStyle = muted; ctx.font = "italic 500 "+Math.round(48*k)+"px Bitter, Georgia, serif"; ctx.fillText(U("tagline"), x, y); }
    secs.forEach(function(s){
      var t = st(s); y += Math.round(118*k);
      if(draw){ ctx.fillStyle = s.color; ctx.fillRect(x, y - 56*k, 16*k, 66*k);
        ctx.fillStyle = text; ctx.font = "800 "+Math.round(70*k)+"px Bitter, Georgia, serif"; ctx.fillText(t.plain, x + 40*k, y); }
      if(S.names){ y += Math.round(54*k); if(draw){ ctx.fillStyle = muted; ctx.font = "italic 500 "+Math.round(42*k)+"px Bitter, Georgia, serif"; ctx.fillText(t.rest, x + 40*k, y); } }
      y += Math.round(8*k);
      ctx.font = "500 "+Math.round(48*k)+"px 'DM Sans', system-ui, sans-serif";
      userItems(s).forEach(function(it){
        var lines = wrap(ctx, it.text, maxW - 84*k);
        y += Math.round(18*k);
        if(draw){ ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(x + 50*k, y + 40*k, 11*k, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = text; }
        lines.forEach(function(l){ y += Math.round(60*k); if(draw) ctx.fillText(l, x + 84*k, y); });
      });
    });
    return y;
  }
  var k = 1; while(k > 0.55 && lay(k, false) > bottom){ k -= 0.05; }
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  var g = ctx.createRadialGradient(W*.85, H*.05, 10, W*.85, H*.05, W*1.1); g.addColorStop(0, "rgba(255,255,255,.08)"); g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  lay(k, true);
  ctx.fillStyle = muted; ctx.font = "italic 500 38px Bitter, Georgia, serif";
  ctx.fillText(U("appName"), x, H - 120);
  return c.toDataURL("image/png");
}

document.addEventListener("click", function(e){
  var b = e.target.closest("button, a"); if(!b) return;
  var d = b.dataset;
  if(d.go){ e.preventDefault(); if(d.go === "now" && view === "now"){ now = {step:"state"}; render(true); return; } go(d.go); return; }
  if(d.lang){ S.lang = d.lang; save(); render(false); return; }
  if(d.week){ S.week = S.week === d.week ? null : d.week; save(); render(false); return; }
  if(d.state){ setState(d.state); return; }
  if(d.sit){ now = {step:"res", sec:d.sit, from:"okay"}; buildOrder(sec(d.sit)); render(true); return; }
  if(d.helped){
    var k = d.helped, on = !now.marked[k];
    now.marked[k] = on; S.helped[k] = Math.max(0, (S.helped[k]||0) + (on?1:-1)); if(!S.helped[k]) delete S.helped[k]; save();
    b.setAttribute("aria-pressed", String(on)); if(on) toast(U("afterHelped")); return;
  }
  if(d.pick){ var pp = d.pick.split("|"), arr = S.picks[pp[0]] = S.picks[pp[0]] || [], i = arr.indexOf(pp[1]);
    if(i >= 0) arr.splice(i,1); else arr.push(pp[1]); save(); openSecs[pp[0]] = true; render(false); return; }
  if(d.delown){ var q = d.delown.split("|"); S.own[q[0]] = (S.own[q[0]]||[]).filter(function(o){ return o.id !== q[1]; }); save(); openSecs[q[0]] = true; render(false); return; }
  if(d.hide){ var h = d.hide, j = S.hidden.indexOf(h); if(j >= 0) S.hidden.splice(j,1); else S.hidden.push(h); save(); openSecs[h] = true; render(false); return; }
  if(d.themepick){ S.theme = d.themepick; save(); render(false); return; }
  if(d.copy){ var c = d.copy.split("|"), ex = EXAMPLES.filter(function(x){ return x.id === c[0]; })[0];
    var row = ex.rows.filter(function(r){ return r[0] === c[1]; })[0]; var txt = row[{en:1,de:2,fr:3}[S.lang]][+c[2]];
    S.own[c[1]] = S.own[c[1]] || []; S.own[c[1]].push({id:uid(), text:txt}); save(); openSecs._ex = true; render(false); toast(U("toast_added")); return; }
  if(d.locksec){ var id = d.locksec, x = lockSel.indexOf(id);
    if(x >= 0) lockSel.splice(x,1); else if(lockSel.length < 4) lockSel.push(id); lockImg = null; render(false); return; }
  if(d.set){ var v = d.val;
    if(d.set === "lang") S.lang = v; if(d.set === "names") S.names = v === "1"; if(d.set === "size") S.size = +v;
    if(d.set === "easy") S.easy = v === "1"; if(d.set === "still") S.still = v === "1"; save(); render(false); return; }
  if(d.preset){ var m = +d.preset; TIMER.total = m*60000; TIMER.end = Date.now() + TIMER.total; TIMER.running = true; TIMER.done = false; render(false); return; }
  switch(d.act){
    case "start-now": S.onboarded = true; save(); go("now"); break;
    case "start-build": S.onboarded = true; save(); go("build"); break;
    case "notsure": now = {step:"body"}; render(true); break;
    case "now-back": now = {step:"state"}; render(true); break;
    case "restart": now = {step:"state"}; render(true); break;
    case "another": now.offset = (now.offset + 3) % now.order.length; render(false); break;
    case "notnow": now = {step:"state"}; render(true); toast(U("afterNotNow")); break;
    case "print": doPrint(); break;
    case "lock-open": lockSel = menuSections().slice(0,4).map(function(s){ return s.id; }); lockImg = null; render(false); break;
    case "lock-close": lockSel = null; lockImg = null; render(false); break;
    case "lock-make": var make = function(){ lockImg = makeLock(); render(false); };
      if(document.fonts && document.fonts.load){ Promise.all([document.fonts.load("800 60px Bitter"), document.fonts.load("italic 500 40px Bitter"), document.fonts.load("500 40px 'DM Sans'")]).then(make, make); } else make(); break;
    case "lock-save":
      if(DL && lockImg){
        var bin = atob(lockImg.split(",")[1]), arr = new Uint8Array(bin.length);
        for(var bi=0; bi<bin.length; bi++) arr[bi] = bin.charCodeAt(bi);
        DL.save({filename:"dopamine-menu-lock-screen.png", data:new Blob([arr], {type:"image/png"})}).catch(function(err){
          if(!err || err.code !== "declined") toast(U("saveFailed"));
        });
      }
      break;
    case "hint-done": S.hintDone = true; save(); render(false); break;
    case "tstop": TIMER.running = false; TIMER.done = false; render(false); break;
    case "clear": confirmClear(); break;
  }
});
